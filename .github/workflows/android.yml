name: Android

on:
  push:
    paths:
      - 'android/**'
  pull_request:
    paths:
      - 'android/**'

# Phase 2-4.2: repository-tracked Gradle wrapper is used for verification.
# Phase 2-6B.5D: Play Integrity readiness validation trigger.

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK
        run: sdkmanager --channel=3 "platforms;android-37.2" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Verify repository-tracked wrapper
        run: |
          test -f ./gradlew
          test -f ./gradlew.bat
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug
