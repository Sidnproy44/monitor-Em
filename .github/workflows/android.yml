name: Android

on:
  push:
    paths:
      - 'android/**'
  pull_request:
    paths:
      - 'android/**'

# Phase 2-4.2: repository-tracked Gradle wrapper is used for verification.

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK
        run: sdkmanager --channel=3 "platforms;android-37.2" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle wrapper for verification
        run: gradle wrapper --gradle-version 9.6.0

      - name: Verify wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload generated wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-bootstrap
          path: |
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
            android/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
